<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
        <link rel="shortcut icon" href="assets/images/logo5.png" type="image/x-icon">
        <meta name="description" content="">

        <title>RAJ - Registro</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <section class="form6 form-registro" id="registro">

            <div class="container">
                <div class="mbr-section-head">
                    <h3 class="mbr-section-title"><strong>Registro</strong></h3>
                </div>

                <div class="row">
                    <form action="#" method="POST" class="mbr-form" id="formRegistro">
                        <div class="dragArea row">

                            <!-- Nombre y apellido -->
                            <div class="campos-2">
                                <div class="form-group">
                                    <input type="text" name="nombre" placeholder="Nombre" class="form-control" id="nombre" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" name="apellido" placeholder="Apellido" class="form-control" id="apellido" required>
                                </div>
                            </div>

                            <!-- Nombre compuesto (opcional) -->
                            <div class="form-group">
                                <input type="text" name="nombreCompuesto" placeholder="Nombre compuesto" class="form-control" id="nombreCompuesto">
                                <p class="ayuda">Este campo es opcional, no hace falta rellenarlo.</p>
                            </div>

                            <!-- Dirección -->
                            <div class="form-group">
                                <input type="text" name="calle" placeholder="Calle" class="form-control" id="calle" required>
                            </div>

                            <div class="campos-2">
                                <div class="form-group">
                                    <input type="text" name="ciudad" placeholder="Ciudad" class="form-control" id="ciudad" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" name="localidad" placeholder="Localidad" class="form-control" id="localidad" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <input type="text" name="codigoPostal" placeholder="Código postal" class="form-control" id="codigoPostal"
                                       inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5"
                                       title="El código postal debe tener exactamente 5 números" required>
                            </div>

                            <!-- Contacto -->
                            <div class="form-group">
                                <input type="tel" name="telefono" placeholder="Teléfono" class="form-control" id="telefono" required>
                            </div>

                            <div class="form-group">
                                <input type="email" name="email" placeholder="Correo electrónico" class="form-control" id="email" required>
                            </div>

                            <!-- Contraseña -->
                            <div class="form-group">
                                <input type="password" name="password" placeholder="Contraseña" class="form-control" id="password"
                                       pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                                       title="Mínimo 8 caracteres, con al menos una mayúscula y un número" required>

                                <ul class="requisitos" id="requisitos">
                                    <li id="req-longitud">Mínimo 8 caracteres</li>
                                    <li id="req-mayuscula">Al menos una mayúscula</li>
                                    <li id="req-numero">Al menos un número</li>
                                </ul>
                            </div>

                            <div class="mbr-section-btn">
                                <button type="submit" class="btn btn-primary">Registro</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <script>
            // Código postal: solo deja escribir números
            const codigoPostal = document.getElementById("codigoPostal");
            codigoPostal.addEventListener("input", () => {
                codigoPostal.value = codigoPostal.value.replace(/\D/g, "").slice(0, 5);
            });

            // Contraseña: marca cada requisito según se va cumpliendo
            const password = document.getElementById("password");
            const requisitos = {
                "req-longitud": (valor) => valor.length >= 8,
                "req-mayuscula": (valor) => /[A-Z]/.test(valor),
                "req-numero": (valor) => /[0-9]/.test(valor)
            };

            password.addEventListener("input", () => {
                for (const id in requisitos) {
                    const cumple = requisitos[id](password.value);
                    document.getElementById(id).classList.toggle("cumple", cumple);
                }
            });
        </script>

    </body>
</html>
