        <!--validaciones y petición PUT -->
        <script>
           

            // Lógica del formulario (Validaciones y envío PUT)
            document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const messageDiv = document.getElementById('responseMessage');

                messageDiv.innerHTML = '';

                // Validar requisitos de la nueva contraseña (Mínimo 8, 1 mayúscula, 1 número)
                const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
                if (!passwordRegex.test(newPassword)) {
                    messageDiv.innerHTML = '<div class="alert alert-warning col-12">La nueva contraseña debe tener al menos 8 caracteres, una letra mayúscula y un número.</div>';
                    return;
                }

                // Validar que la nueva contraseña y su repetición coinciden
                if (newPassword !== confirmPassword) {
                    messageDiv.innerHTML = '<div class="alert alert-warning col-12">Las nuevas contraseñas no coinciden.</div>';
                    return;
                }

                // Petición PUT al servidor
                fetch("/raj/webresources/password", {
                    method: "PUT",
                    headers: { 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        currentPassword: currentPassword, 
                        newPassword: newPassword 
                    })
                })
                .then(response => {
                    if (response.status === 204) {
                        messageDiv.innerHTML = '<div class="alert alert-success col-12">¡Contraseña actualizada con éxito!</div>';
                        document.getElementById('changePasswordForm').reset();
                    } else if (response.status === 403) {
                        messageDiv.innerHTML = '<div class="alert alert-danger col-12">La contraseña actual es incorrecta.</div>';
                    } else if (response.status === 400) {
                        messageDiv.innerHTML = '<div class="alert alert-warning col-12">La nueva contraseña no cumple las reglas del servidor o es igual a la actual.</div>';
                    } else if (response.status === 401) {
                        messageDiv.innerHTML = '<div class="alert alert-danger col-12">No hay sesión activa. Inicia sesión de nuevo.</div>';
                    } else {
                        messageDiv.innerHTML = '<div class="alert alert-danger col-12">Error inesperado (Código: ' + response.status + ').</div>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    messageDiv.innerHTML = '<div class="alert alert-danger col-12">Error de conexión con el servidor.</div>';
                });
            });
        </script>
